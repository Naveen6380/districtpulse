spring.application.name=districtpulse
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/districtpulse?serverTimezone=UTC}
spring.datasource.username=${DB_USER:districtpulse}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:file:./secrets.properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8081}
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
district.id=${DISTRICT_ID:pudukkottai}
district.name=${DISTRICT_NAME:Pudukkottai}
district.state=${DISTRICT_STATE:Tamil Nadu}
district.latitude=${DISTRICT_LATITUDE:}
district.longitude=${DISTRICT_LONGITUDE:}
weather.live-enabled=${WEATHER_LIVE_ENABLED:true}
district.aliases=${DISTRICT_ALIASES:Pudukkottai,Pudukottai,புதுக்கோட்டை}
district.taluks=${DISTRICT_TALUKS:Pudukkottai,Alangudi,Aranthangi,Avudaiyarkoil,Gandarvakottai,Illuppur,Karambakudi,Kulathur,Manamelkudi,Ponnamaravathy,Thirumayam,Viralimalai}
news.rss.urls=${NEWS_RSS_URLS:https://news.google.com/rss/search?q=Pudukkottai+when:30d&hl=en-IN&gl=IN&ceid=IN:en}
ai.provider=${AI_PROVIDER:mock}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.min-interval-ms=${GEMINI_MIN_INTERVAL_MS:8000}
source.secret-key=${SOURCE_SECRET_KEY:}
app.jwt-secret=${JWT_SECRET:}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
app.cors-origins=${CORS_ORIGINS:http://localhost:8080,http://localhost:5173}
app.pipeline-enabled=${PIPELINE_ENABLED:false}
app.pipeline-delay-ms=${PIPELINE_DELAY_MS:1800000}

source.allowed-hosts=${SOURCE_ALLOWED_HOSTS:news.google.com,imd.gov.in,mausam.imd.gov.in,agmarknet.gov.in,api.data.gov.in,pudukkottai.nic.in,tn.gov.in}
